<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#1a1614"/>
  <!-- Vinyl record outer rim -->
  <circle cx="32" cy="32" r="24" fill="#0a0908" stroke="#2a2220" stroke-width="1"/>
  <!-- Grooves -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#2a2624" stroke-width="0.8" opacity="0.6"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#2a2624" stroke-width="0.8" opacity="0.6"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#2a2624" stroke-width="0.6" opacity="0.5"/>
  <!-- Label -->
  <circle cx="32" cy="32" r="8" fill="#d4a574"/>
  <circle cx="32" cy="32" r="7" fill="#c19064"/>
  <circle cx="32" cy="32" r="5.5" fill="none" stroke="#b8835a" stroke-width="0.5"/>
  <!-- Center hole -->
  <circle cx="32" cy="32" r="2" fill="#0a0908"/>
  <!-- Shine -->
  <path d="M32 10 Q36 18 32 24" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.15"/>
</svg>
